name: Deploy para GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Build Vite
        run: npx vite build
        env:
          TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
          TINA_BRANCH: main

      - name: Copiar admin para dist
        run: cp -r dist/admin ./admin_temp && cp -r ./admin_temp dist/admin
        continue-on-error: true

      - name: Copiar admin do repositório para dist
        run: |
          mkdir -p dist/admin
          cp -r dist/admin/* dist/admin/ 2>/dev/null || true
          ls -la dist/

      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true