name: Deploy para GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Build Vite
        run: npx vite build
        env:
          TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
          TINA_BRANCH: main

      - name: Listar tudo no repositório e no dist
        run: |
          echo "=== RAIZ DO REPO ==="
          ls -la
          echo "=== PASTA ADMIN NA RAIZ ==="
          ls -la admin/ || echo "NAO EXISTE"
          echo "=== PASTA DIST ==="
          ls -la dist/
          echo "=== PASTA DIST/ADMIN ==="
          ls -la dist/admin/ || echo "NAO EXISTE"

      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true