name: Deploy para GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Build Tina (gera admin)
        run: npx @tinacms/cli build
        env:
          TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
          TINA_BRANCH: main

      - name: Verificar onde o admin foi gerado
        run: |
          echo "=== public/admin ==="
          ls -la public/admin/ || echo "NAO EXISTE"
          echo "=== dist/admin ==="
          ls -la dist/admin/ || echo "NAO EXISTE"
          echo "=== raiz ==="
          ls -la | grep admin || echo "NAO EXISTE NA RAIZ"

      - name: Build Vite
        run: npx vite build
        env:
          TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
          TINA_BRANCH: main

      - name: Mover admin para dist
        run: |
          if [ -d "public/admin" ]; then
            echo "Copiando de public/admin"
            cp -r public/admin dist/admin
          elif [ -d "dist/admin" ]; then
            echo "Admin ja esta no dist"
          else
            echo "Admin nao encontrado em lugar nenhum!"
          fi
          ls -la dist/

      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true